name: Deploy Node.js Server

on:
  push:
    branches:
      - main # Triggers on push to main branch (adjust if needed)

jobs:
  deploy:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout Code
        uses: actions/checkout@v6

      - name: Create .env file from Secrets
        run: |
          echo "MONGO_URI=${{ secrets.MONGO_URI }}" >> .env
          echo "JWT_SECRET=${{ secrets.JWT_SECRET }}" >> .env
          echo "PORT=${{ secrets.PORT }}" >> .env
          # Add any other secrets your app requires

      - name: Copy Files to Remote Server
        uses: appleboy/scp-action@master
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          password: ${{ secrets.SERVER_PASSWORD }}
          # Exclude .git, .github, and node_modules folders to speed up transfer
          source: ".,!.git,!.github,!node_modules"
          target: "${{ secrets.SERVER_TARGET_PATH }}" # e.g. /var/www/acrapath_server

      - name: Install Dependencies and Start PM2
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          password: ${{ secrets.SERVER_PASSWORD }}
          script: |
            # Navigate to the target directory
            cd ${{ secrets.SERVER_TARGET_PATH }}
            
            # Install Node modules
            npm install
            
            # Start or restart the PM2 process using the ecosystem config
            pm2 start ecosystem.config.cjs || pm2 restart acrapath_server
            
            # Save the PM2 list so it restarts on server reboot
            pm2 save
